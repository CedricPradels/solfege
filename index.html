<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1E28" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Tutoriel de solfège en 10 leçons pour choriste débutant, avec exercices de chant au micro.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Solfège du choriste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500;1,700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Une colonne de lecture façon livret de chant ; les consignes en rouge « rubrique » comme dans les livres liturgiques, la note en cours de lecture en violet. */
:root{
  --paper:#F3F4F7; --surface:#FFFFFF; --ink:#1B2131; --muted:#596175; --line:#D6DAE3; --staff:#4A5166;
  --rubric:#AE261E; --rubric-soft:#F8E7E5; --play:#5A3E99; --play-soft:#ECE7F7;
  --ok:#21704A; --ok-soft:#E1F1E7; --warn:#93540A; --warn-soft:#FAEEDC;
  --now:#0B3DB0; --now-bg:#FFDD3C;
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --surface:#1A1E28; --ink:#E7E9F0; --muted:#9EA5B6; --line:#2C3242; --staff:#AEB5C5;
    --rubric:#EE6F64; --rubric-soft:#3A1F1E; --play:#AE97EE; --play-soft:#2B2444;
    --ok:#62CB91; --ok-soft:#173020; --warn:#E9B15E; --warn-soft:#35290F; color-scheme:dark;
    --now:#10131C; --now-bg:#FFD83D;
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --surface:#1A1E28; --ink:#E7E9F0; --muted:#9EA5B6; --line:#2C3242; --staff:#AEB5C5;
  --rubric:#EE6F64; --rubric-soft:#3A1F1E; --play:#AE97EE; --play-soft:#2B2444;
  --ok:#62CB91; --ok-soft:#173020; --warn:#E9B15E; --warn-soft:#35290F; color-scheme:dark;
  --now:#10131C; --now-bg:#FFD83D;
}
*{box-sizing:border-box}
button,a,input,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--play);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:720px;margin:0 auto}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{font:700 1.15rem/1.2 var(--f-display);text-decoration:none;margin-right:auto}
.brand span{color:var(--rubric)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.nav a{text-decoration:none;font-weight:500;font-size:.92rem;padding:5px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.nav a[aria-current="page"]{background:var(--play-soft);color:var(--play)}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.9rem,6vw,2.6rem);margin:.1em 0 .35em;font-weight:700}
h2{font-size:1.5rem;margin:1.8em 0 .5em}
h3{font-size:1.25rem;margin:1.7em 0 .4em}
p{margin:.6em 0}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--rubric);margin:0}
.lead{font-size:1.12rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--staff)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.play{border-color:var(--play);color:var(--play)}
.btn.sm{padding:5px 12px;font-size:.9rem}
.btn[aria-pressed="true"]{background:var(--play);border-color:var(--play);color:var(--surface)}
.btn svg{width:14px;height:14px;fill:currentColor}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Accueil */
.hero{padding-block:8px 4px}
.hero p.lead{max-width:60ch}
.resume{margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:22px 0}
.panel h2{margin-top:0;font-size:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lessons{list-style:none;padding:0;margin:0;display:grid;gap:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.lessons a{display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px 12px;align-items:baseline;padding:14px 4px;text-decoration:none}
.lessons a:hover .lt{color:var(--play)}
.ln-num{font:700 1.35rem/1 var(--f-display);color:var(--rubric);font-variant-numeric:tabular-nums}
.lt{font-weight:700;font-size:1.05rem}
.lg{grid-column:2;color:var(--muted);font-size:.92rem;line-height:1.45;min-width:0}
.st{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:center}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.todo{background:transparent;color:var(--muted);border:1px solid var(--line)}
.st.cur{background:var(--play-soft);color:var(--play)}
.tips{padding-left:1.1em}
.tips li{margin:.3em 0}

/* Leçon */
.goal{background:var(--surface);border-left:3px solid var(--ok);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0 6px}
.rub{border:1px solid var(--rubric);background:var(--rubric-soft);border-radius:var(--radius);padding:14px 18px;margin:28px 0}
.rub-t{font-family:var(--f-display);font-style:italic;font-weight:700;color:var(--rubric);margin:0 0 4px;font-size:1.08rem}
.rub ol{margin:.3em 0;padding-left:1.2em}
table{border-collapse:collapse;width:100%;font-size:.95rem}
.tw{overflow-x:auto;margin:12px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.sym{font:italic 700 1.2rem/1.2 var(--f-display);white-space:nowrap}
.mnemo{font-family:var(--f-display);font-style:italic;font-size:1.1rem}
.mnemo b{color:var(--rubric);font-style:normal}

/* Figures musicales */
.fig{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px}
.fig .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.fig figcaption{font-size:.92rem;color:var(--muted);margin:6px 4px 8px;line-height:1.45}
.fig .row{margin:0 2px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pair .fig{margin:6px 0}
svg.staff{display:block;width:100%;height:auto;color:var(--ink);margin:0 auto}
.staff .ln{stroke:var(--staff);stroke-width:1}
.staff .lb{fill:var(--muted);font:500 12px var(--f-body)}
.staff .lb.hi{fill:var(--rubric);font-weight:700}
.staff .ly{fill:var(--ink);font:italic 500 14px var(--f-display)}
.staff .ts{fill:currentColor;font:700 21px var(--f-display)}
.staff .c8{fill:currentColor;font:700 11px var(--f-display)}
.staff .hi{color:var(--rubric)}
.staff .okn{color:var(--ok)}
.staff .tgt{color:var(--rubric)}
.staff .tgt>.hit{fill:var(--rubric-soft);stroke:var(--rubric);stroke-width:1.5}
.staff .on{color:var(--now)}
.staff .on>.hit{fill:var(--now-bg);fill-opacity:.9;stroke:var(--now);stroke-width:1.5}
.swipe{display:none;font-size:.8rem;color:var(--muted);margin:4px 4px 0}
.scroll.ovf+.swipe{display:block}
.scroll.ovf:not(.end){-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.staff [data-m]{cursor:pointer}
.staff .nm{display:none}
.show-names .staff .nm{display:inline}
.staff .vl{fill:var(--muted);font:700 11px var(--f-body);letter-spacing:.05em}

/* Quiz */
.quiz{margin-top:36px;border-top:2px solid var(--ink);padding-top:6px}
.qlist{padding-left:1.3em}
.q{margin:18px 0}
.qq{font-weight:700;margin:.2em 0 .5em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;text-align:left;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--staff)}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.opt:disabled{cursor:default}
.fb{font-size:.95rem;margin:.5em 0 0;padding:8px 12px;border-radius:8px}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--warn-soft)}
.fb b{font-weight:700}
.qres{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-top:16px}
.qres strong{font:700 1.4rem var(--f-display)}

.notes textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:10px 12px;font:inherit;font-size:1rem;resize:vertical}
.done-row{margin:30px 0 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.isdone{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.pn a{text-decoration:none;font-weight:500;min-width:0}
.pn small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}

/* Widgets */
.widget{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0}
.widget h3{margin-top:0}
.kb-wrap{overflow-x:auto}
.kb{position:relative;display:flex;height:170px;user-select:none;-webkit-user-select:none}
.kw{flex:1;border:1px solid var(--staff);border-right-width:0;background:#FFFFFF;color:#2A3040;border-radius:0 0 6px 6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 8px;font-size:.78rem;font-weight:700;cursor:pointer;touch-action:manipulation}
.kw:last-of-type{border-right-width:1px}
.kw small{font-weight:500;font-size:.62rem;color:#AE261E;line-height:1.1;text-align:center}
.kbk{position:absolute;top:0;height:60%;background:#1E2230;border:1px solid #1E2230;border-radius:0 0 4px 4px;cursor:pointer;z-index:2;touch-action:manipulation}
.kw.on{background:var(--now-bg);color:#10131C}
.kbk.on{background:var(--now-bg);border-color:#10131C}
.metro .dots{display:flex;gap:10px;margin:12px 0}
.metro .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--staff)}
.metro .dots i.on{background:var(--play);border-color:var(--play)}
.metro .dots i.first{border-color:var(--rubric)}
.metro .dots i.first.on{background:var(--rubric)}
input[type=range]{width:min(100%,280px);accent-color:var(--play)}
.tempo{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.trainer .card{display:flex;justify-content:center;min-height:140px;align-items:center}
.trainer .card svg{max-width:260px}
.trainer .answers{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.trainer .answers .opt{text-align:center;font-weight:700;min-height:52px;padding:4px 2px;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:12px}
.stats b{color:var(--ink)}
.msg{min-height:1.6em;margin:.6em 0 0;font-weight:500}
.msg.good{color:var(--ok)} .msg.bad{color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--play);color:var(--surface)}
dl.lex{margin:0}
dl.lex div{padding:10px 0;border-bottom:1px solid var(--line)}
dl.lex dt{font-weight:700;font-family:var(--f-display);font-size:1.08rem}
dl.lex dd{margin:2px 0 0;color:var(--muted)}
.code{width:100%;min-height:90px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px;word-break:break-all}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.status.off i{background:var(--warn)}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);padding:12px 14px;border-radius:8px;margin-top:10px}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-block:18px 28px}
/* Chant */
.sing{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:18px 0}
.sing h3{margin:.15em 0 .2em}
.sing .sfig .fig{margin:10px 0}
.echo-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px}
.qmark{font:700 3rem/1 var(--f-display);color:var(--muted)}
.snow{display:grid;gap:8px;margin:8px 0 12px}
.target{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.tl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tname{font:700 2.3rem/1 var(--f-display);color:var(--rubric);min-width:3ch}
.sung{color:var(--muted);margin-left:auto;font-weight:500}
.gauge{position:relative;height:42px;border-radius:10px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;left:27.5%;width:45%;background:var(--ok-soft)}
.gauge .mid{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--ok);opacity:.6}
.gauge .needle{position:absolute;top:5px;bottom:5px;left:50%;width:10px;margin-left:-5px;border-radius:5px;background:var(--warn);transition:left .09s linear}
.gauge .needle.ok{background:var(--ok)}
.gauge .needle.off{opacity:0}
.glab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.holdbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .09s linear}
.sing .self{margin-bottom:10px}
.sing.selfmode .gauge,.sing.selfmode .glab,.sing.selfmode .holdbar,.sing.selfmode .sung{display:none}
.oct{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted)}
.oct input{width:22px;height:22px;accent-color:var(--play);flex:none}
.sres{background:var(--ok-soft);border-radius:var(--radius);padding:12px 16px;margin-top:12px}
.sres strong{font:700 1.4rem var(--f-display)}
.micnote{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.micnote p{margin:.3em 0}
details.sx{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0}
details.sx>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr auto;gap:2px 10px;align-items:center;padding:12px 14px;min-height:60px}
details.sx>summary::-webkit-details-marker{display:none}
details.sx[open]>summary{border-bottom:1px solid var(--line)}
details.sx .sing{border:0;margin:0!important;border-radius:0}
.tabbar{display:none}
@media (max-width:640px){
  body{font-size:17px}
  .top .nav{display:none}
  .top-in{padding-block:9px;flex-wrap:nowrap}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;text-decoration:none;font-size:.72rem;font-weight:500;color:var(--muted)}
  .tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current="page"]{color:var(--play)}
  .tabbar a[aria-current="page"] svg{stroke-width:2.3}
  main{padding-block:20px 40px}
  footer{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fig{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0;padding:10px 6px}
  .fig figcaption{margin:6px 10px 10px}
  .fig .row{margin:0 10px}
  .pair .fig{margin:6px -16px}
  .btn.sm{min-height:42px;padding:8px 14px}
  .btn{min-height:46px}
  .opt{min-height:46px;padding:9px 14px}
  .tw{margin-left:-4px;margin-right:-4px}
  th,td{padding:8px 10px}
  .panel{padding:16px}
  .pn{flex-direction:column}
  .pn a[style]{text-align:left!important}
  .lessons a{padding:14px 0}
  .widget,.sing{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}
  .sing .sfig .fig{margin-left:-16px;margin-right:-16px}
  details.sx{margin-left:-6px;margin-right:-6px}
  .tabbar{grid-template-columns:repeat(5,1fr)}
  .tabbar a{font-size:.68rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in gut col">
    <a class="brand" href="#accueil">Solfège <span>du</span> choriste</a>
    <div class="prog" title="Leçons terminées"><span id="progTxt">0 / 10</span><div class="pbar"><i id="progBar"></i></div></div>
    <nav class="nav" aria-label="Sections">
      <a href="#accueil" data-nav="accueil">Parcours</a>
      <a href="#chant" data-nav="chant">Chanter</a>
      <a href="#entrainement" data-nav="entrainement">Entraînement</a>
      <a href="#lexique" data-nav="lexique">Lexique</a>
      <a href="#sauvegarde" data-nav="sauvegarde">Ma progression</a>
    </nav>
  </div>
</header>
<main class="gut"><div class="col" id="view"></div></main>
<footer class="gut"><div class="col"><span class="status" id="storeStatus"><i></i><span>Progression enregistrée dans ce navigateur</span></span></div></footer>
<nav class="tabbar" aria-label="Sections">

<script>
(function(){
"use strict";
/* ---------- Stockage ---------- */
const KEY="solfege-choriste-v1";
const def=()=>({v:1,voice:"",done:{},quiz:{},notes:{},train:{sol:{best:0,ok:0,n:0},fa:{best:0,ok:0,n:0},ry:{best:0,ok:0,n:0}},chant:{range:{lo:null,hi:null},ex:{}},last:0});

function load(){

  return def();
}
function merge(o){const d=def(); if(!o||typeof o!=="object") return d;
  const r=Object.assign(d,o); r.train=Object.assign(def().train,o.train||{});
  ["sol","fa","ry"].forEach(k=>{r.train[k]=Object.assign({best:0,ok:0,n:0},r.train[k]||{});});
  r.done=r.done||{}; r.quiz=r.quiz||{}; r.notes=r.notes||{};
  r.chant=Object.assign({range:{lo:null,hi:null},ex:{}},o.chant||{}); r.chant.range=Object.assign({lo:null,hi:null},r.chant.range||{}); r.chant.ex=r.chant.ex||{};
  return r;}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S)); storageOK=true;}catch(e){storageOK=false;}
  updateStatus(); updateProgress();
}
function updateStatus(){const el=document.getElementById("storeStatus"); if(!el) return;

  document.getElementById("progTxt").textContent=n+" / 10";
  document.getElementById("progBar").style.width=(n*10)+"%";}

/* ---------- Théorie & dessin ---------- */
const LETTERS="CDEFGAB", SEMI=[0,2,4,5,7,9,11], FR=["do","ré","mi","fa","sol","la","si"];
const ACCV={"#":1,"b":-1,"n":0}, ACCS={"#":"♯","b":"♭","n":"♮"};
const W={w:58,h:44,q:34,e:28,s:24}, BEATS={w:4,h:2,q:1,e:.5,s:.25};
const SH=[38,35,39,36,33,37,34], FLp=[34,37,33,36,32,35,31], SHL="FCGDAEB", FLL="BEADGCF";
function parseP(p){const m=/^([A-G])(#|b|n)?(-?\d)$/.exec(p); const li=LETTERS.indexOf(m[1]), oct=+m[3];

const TREBLE="M13 31C9.5 31 8.5 26.5 12 24.5C16.5 22 21.5 26 20.5 31.5C19.5 37.5 11 39.5 6.5 35.5C2 31 3 23.5 8.5 18C13.5 13 18.5 9 18 1C17.5 -6 15 -11.5 12.5 -11.5C9 -11.5 8 -3 10 5L15.5 47C16 53 12 56 8.5 53.5";
function clefSVG(c,x,T){

  return `<g transform="translate(${x},${T})"><path d="${TREBLE}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.2" cy="51.6" r="3.2" fill="currentColor"/>${c==="sol8"?'<text class="c8" x="11" y="67" text-anchor="middle">8</text>':""}</g>`;
}
function accSVG(a,x,y){
  if(a==="#") return `<g transform="translate(${x},${y})"><path d="M-2.2 -11V12M2.4 -13V10" stroke="currentColor" stroke-width="1.3"/><path d="M-5 -2.2L5 -5.4V-2.6L-5 0.6ZM-5 5L5 1.8V4.6L-5 7.8Z" fill="currentColor"/></g>`;
  if(a==="b") return `<g transform="translate(${x},${y})"><path d="M-3 -15V5" stroke="currentColor" stroke-width="1.4"/><path d="M-3 5C2 2.5 5 -1 3.6 -3.4C2.2 -5.6 -1 -4.4 -3 -1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></g>`;
  return `<g transform="translate(${x},${y})"><path d="M-2.8 -12V5.5M2.8 -5.5V12" stroke="currentColor" stroke-width="1.3"/><path d="M-2.8 -2.6L2.8 -4.6V-2L-2.8 0ZM-2.8 4.6L2.8 2.6V5.2L-2.8 7.2Z" fill="currentColor"/></g>`;
}
const REST={
  w:'<rect x="0" y="10" width="12" height="5" fill="currentColor"/>',
  h:'<rect x="0" y="15" width="12" height="5" fill="currentColor"/>',
  q:'<path d="M3.5 4.5L9.5 12.5L5 18.5L10.5 26C5 23.5 3 28 7.5 33" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>',
  e:'<circle cx="4" cy="15" r="2.6" fill="currentColor"/><path d="M4 16.8C7 18.4 10 17.6 11.5 14L6.5 31" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  s:'<circle cx="5" cy="15" r="2.5" fill="currentColor"/><circle cx="3" cy="23" r="2.5" fill="currentColor"/><path d="M5 16.6C8 18 11 17.4 12.5 14L5.5 38M3 24.6C6 26 9 25.4 10.6 22" fill="none" stroke="currentColor" stroke-width="1.6"/>'
};
function head(x,y,d){
  if(d==="w") return `<ellipse cx="${x}" cy="${y}" rx="7" ry="4.6" fill="none" stroke="currentColor" stroke-width="2.4"/>`;
  if(d==="h") return `<ellipse cx="${x}" cy="${y}" rx="5.8" ry="4" transform="rotate(-22 ${x} ${y})" fill="none" stroke="currentColor" stroke-width="2"/>`;
  return `<ellipse cx="${x}" cy="${y}" rx="6.2" ry="4.4" transform="rotate(-22 ${x} ${y})" fill="currentColor"/>`;
}
function ledgers(x,d,ref,yOf){let s="";
  for(let k=ref-2;k>=d;k-=2) s+=`<line class="ln" x1="${x-10}" x2="${x+10}" y1="${yOf(k)}" y2="${yOf(k)}"/>`;
  for(let k=ref+10;k<=d;k+=2) s+=`<line class="ln" x1="${x-10}" x2="${x+10}" y1="${yOf(k)}" y2="${yOf(k)}"/>`;
  return s;}
function flag(sx,ey,dir){const s=dir==="up"?1:-1;
  return `<path d="M${sx} ${ey}C${sx+1} ${ey+7*s} ${sx+10} ${ey+9*s} ${sx+7} ${ey+20*s}" fill="none" stroke="currentColor" stroke-width="1.7"/>`;}
function noteName(p){const q=parseP(p); return FR[q.li]+(q.acc&&q.acc!=="n"?ACCS[q.acc]:"");}

let figSeq=0; const FIGS={};
function staffSVG(spec){
  const clef=spec.clef||"sol", ref=clef==="fa"?18:30, T=34, mid=ref+4, yOf=d=>T+40-(d-ref)*5;
  const km=keyMap(spec.key||0), osh=clef==="sol8"?-12:0;
  const P=[]; let x=6;
  P.push(clefSVG(clef,x,T)); x+=clef==="fa"?36:30;
  if(spec.key){const arr=spec.key>0?SH:FLp; for(let i=0;i<Math.abs(spec.key);i++){P.push(accSVG(spec.key>0?"#":"b",x+4,yOf(arr[i]-(clef==="fa"?14:0)))); x+=9;} x+=6;}
  if(spec.time){P.push(`<text class="ts" x="${x+8}" y="${T+18}" text-anchor="middle">${spec.time[0]}</text><text class="ts" x="${x+8}" y="${T+38}" text-anchor="middle">${spec.time[1]}</text>`); x+=24;}
  x+=16;
  const notes=[], ev=[], bars=[]; let mAcc={}, tieEv=null;
  spec.items.forEach((it,i)=>{
    if(it.bar){const t=it.bar; const bx=t==="repS"?x-12:x-8; bars.push({x:bx,t});
      if(t==="repS") ev.push({mark:"S"}); if(t==="repE") ev.push({mark:"E"});
      mAcc={}; x+= t==="repS"?18:(t==="repE"?14:12); return;}
    const dk=it.d||it.r, dur=BEATS[dk]*(it.dot?1.5:1);
    if(it.r){notes.push({i,x,rest:it.r,it}); ev.push({m:null,dur,k:[i]}); x+=W[it.r]+(it.dot?8:0); tieEv=null; return;}
    const p=parseP(it.n), showAcc=!!p.acc && !it.noAcc;
    if(showAcc) x+=10;
    let alt; if(p.acc){alt=ACCV[p.acc]; mAcc[p.dia]=alt;} else if(p.dia in mAcc) alt=mAcc[p.dia]; else alt=km[LETTERS[p.li]]||0;
    const midi=p.base+alt+osh, y=yOf(p.dia);

    if(tieEv){tieEv.dur+=dur; tieEv.k.push(i);} else ev.push({m:midi,dur,k:[i]});
    tieEv=it.tie?ev[ev.length-1]:null;
    x+=W[it.d]+(it.dot?8:0);
  });
  // ligatures (barres de croches)
  const groups=[]; let g=null;
  notes.forEach(n=>{if(n.rest) return; const b=n.it.beam; if(b==="b"){g=[n];groups.push(g);} else if(g&&b){g.push(n); if(b==="e") g=null;}});
  const BEAMS=[];
  groups.forEach(g=>{const avg=g.reduce((s,n)=>s+n.dia,0)/g.length, dir=avg>=mid?"down":"up", ys=g.map(n=>n.y);
    const by=dir==="up"?Math.min(...ys)-30:Math.max(...ys)+30; g.forEach(n=>{n.dir=dir;n.beamed=true;n.stemEnd=by;});
    const x1=dir==="up"?g[0].x+5.6:g[0].x-5.6, x2=dir==="up"?g[g.length-1].x+5.6:g[g.length-1].x-5.6, th=4.5;
    const y0=dir==="up"?by:by-th; BEAMS.push(`<rect x="${x1-.7}" y="${y0}" width="${x2-x1+1.4}" height="${th}" fill="currentColor"/>`);
    if(g.every(n=>n.d==="s")) BEAMS.push(`<rect x="${x1-.7}" y="${dir==="up"?y0+7:y0-7}" width="${x2-x1+1.4}" height="${th}" fill="currentColor"/>`);
  });
  let maxB=T+40;
  notes.forEach((n,idx)=>{
    const cls=n.it.hi?"nt hi":"nt";
    if(n.rest){P.push(`<g class="${cls}" data-k="${n.i}" transform="translate(${n.x-6},${T})"><rect class="hit" x="-6" y="1" width="24" height="38" rx="7" fill="transparent"/>${REST[n.rest]}</g>`); return;}
    let s=`<g class="${cls}" data-k="${n.i}" data-m="${n.midi}"><rect class="hit" x="${n.x-13}" y="${n.y-13}" width="26" height="26" rx="8" fill="transparent"/>`;
    s+=ledgers(n.x,n.dia,ref,yOf);
    if(n.acc) s+=accSVG(n.acc,n.x-15,n.y);
    s+=head(n.x,n.y,n.d);
    if(n.d!=="w"){const up=n.dir==="up", sx=up?n.x+5.6:n.x-5.6, ey=n.stemEnd!==undefined?n.stemEnd:(up?n.y-34:n.y+34);
      s+=`<line x1="${sx}" y1="${n.y+(up?-1:1)}" x2="${sx}" y2="${ey}" stroke="currentColor" stroke-width="1.4"/>`;
      if(!n.beamed&&(n.d==="e"||n.d==="s")){s+=flag(sx,ey,n.dir); if(n.d==="s") s+=flag(sx,ey+(up?7:-7),n.dir);}
      if(!up) maxB=Math.max(maxB,ey);}
    maxB=Math.max(maxB,n.y+7);
    if(n.dot){const onLine=(((n.dia-ref)%2)+2)%2===0; s+=`<circle cx="${n.x+11}" cy="${n.y+(onLine?-5:0)}" r="2" fill="currentColor"/>`;}
    if(n.it.tie){const nx=notes[idx+1]; if(nx&&!nx.rest){const sg=n.dir==="up"?1:-1, y1=n.y+sg*7; s+=`<path d="M${n.x+5} ${y1}Q${(n.x+nx.x)/2} ${y1+sg*10} ${nx.x-5} ${y1}" fill="none" stroke="currentColor" stroke-width="1.6"/>`;}}
    s+="</g>"; P.push(s);

    if(b.t==="end") P.push(`<line x1="${x-4}" x2="${x-4}" y1="${T}" y2="${T+40}" stroke="currentColor" stroke-width="1.2"/><rect x="${x-1}" y="${T}" width="4" height="40" fill="currentColor"/>`);
    else if(b.t==="repS") P.push(`<rect x="${x}" y="${T}" width="4" height="40" fill="currentColor"/><line x1="${x+7}" x2="${x+7}" y1="${T}" y2="${T+40}" stroke="currentColor" stroke-width="1.2"/><circle cx="${x+12}" cy="${T+15}" r="2" fill="currentColor"/><circle cx="${x+12}" cy="${T+25}" r="2" fill="currentColor"/>`);

    else P.push(`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+40}" stroke="currentColor" stroke-width="1.2"/>`);
  });
  const last=bars.length&&spec.items[spec.items.length-1].bar?bars[bars.length-1].x+4:x-10;
  const Wd=Math.max(last,spec.minW||0);
  const hasLy=spec.items.some(i=>i.l), hasLb=spec.names||spec.toggle||spec.items.some(i=>i.t);
  let ry=Math.max(T+40+24,maxB+17); const rowLy=ry; if(hasLy) ry+=20; const rowLb=ry;
  notes.forEach(n=>{
    if(n.it.l) P.push(`<text class="ly" x="${n.x}" y="${rowLy}" text-anchor="middle">${n.it.l}</text>`);
    const lab=n.it.t!==undefined?n.it.t:((spec.names||spec.toggle)&&!n.rest?n.name:"");
    if(lab) P.push(`<text class="lb${n.it.hi?" hi":""}${spec.toggle&&n.it.t===undefined?" nm":""}" x="${n.x}" y="${rowLb}" text-anchor="middle">${lab}</text>`);
  });
  const H=hasLb?rowLb+10:(hasLy?rowLy+10:Math.max(T+40+18,maxB+10));
  let lines=""; for(let i=0;i<5;i++) lines+=`<line class="ln" x1="0" x2="${Wd}" y1="${T+i*10}" y2="${T+i*10}"/>`;
  const svg=`<svg class="staff" viewBox="0 0 ${Wd} ${H}" style="max-width:${Math.round(Wd*1.35)}px;min-width:${Math.round(Math.min(Wd*.85,Wd))}px" role="img" aria-label="${spec.aria||"Portée musicale"}">${lines}${P.join("")}</svg>`;
  return {svg,ev};
}

/* Partition à 4 voix (2 portées) */
function satbSVG(spec){
  const T=34, B=T+112, km=keyMap(spec.key||0), yS=d=>T+40-(d-30)*5, yB=d=>B+40-(d-18)*5;
  const P=[]; let x=18; const midY=(T+B+40)/2;
  P.push(`<path d="M11 ${T}C3 ${T+14} 10 ${midY-16} 4 ${midY}C10 ${midY+16} 3 ${B+26} 11 ${B+40}" fill="none" stroke="currentColor" stroke-width="2.4"/>`);
  P.push(`<line x1="14" x2="14" y1="${T}" y2="${B+40}" stroke="currentColor" stroke-width="1.4"/>`);
  P.push(clefSVG("sol",x,T),clefSVG("fa",x,B)); x+=36;
  if(spec.key){for(let i=0;i<spec.key;i++){P.push(accSVG("#",x+4,yS(SH[i])),accSVG("#",x+4,yB(SH[i]-14))); x+=9;} x+=6;}
  if(spec.time){[T,B].forEach(t=>P.push(`<text class="ts" x="${x+8}" y="${t+18}" text-anchor="middle">${spec.time[0]}</text><text class="ts" x="${x+8}" y="${t+38}" text-anchor="middle">${spec.time[1]}</text>`)); x+=24;}
  x+=16;
  const lists={s:[],a:[],t:[],b:[]}; let lastBar=0;
  spec.cols.forEach((c,i)=>{
    if(c.bar){const bx=x-8; lastBar=bx+4;
      if(c.bar==="end") P.push(`<line x1="${bx-4}" x2="${bx-4}" y1="${T}" y2="${B+40}" stroke="currentColor" stroke-width="1.2"/><rect x="${bx-1}" y="${T}" width="4" height="${B+40-T}" fill="currentColor"/>`);
      else P.push(`<line x1="${bx}" x2="${bx}" y1="${T}" y2="${B+40}" stroke="currentColor" stroke-width="1.2"/>`);
      x+=12; return;}
    const dur=BEATS[c.d];
    ["s","a","t","b"].forEach(v=>{const p=parseP(c[v]), top=v==="s"||v==="a", ref=top?30:18, yf=top?yS:yB, y=yf(p.dia), up=v==="s"||v==="t";
      const alt=p.acc?ACCV[p.acc]:(km[LETTERS[p.li]]||0), midi=p.base+alt; lists[v].push({m:midi,dur,k:[i]});
      const sx=up?x+5.6:x-5.6, ey=up?y-32:y+32;
      P.push(`<g class="nt" data-k="${i}" data-v="${v}" data-m="${midi}"><rect class="hit" x="${x-12}" y="${y-12}" width="24" height="24" rx="8" fill="transparent"/>${ledgers(x,p.dia,ref,yf)}${head(x,y,c.d)}<line x1="${sx}" y1="${y+(up?-1:1)}" x2="${sx}" y2="${ey}" stroke="currentColor" stroke-width="1.4"/></g>`);
    });

    x+=W[c.d]+6;

  [T,B].forEach(t=>{for(let i=0;i<5;i++) lines+=`<line class="ln" x1="14" x2="${Wd}" y1="${t+i*10}" y2="${t+i*10}"/>`;});
  const H=B+100;
  return {svg:`<svg class="staff" viewBox="0 0 ${Wd} ${H}" style="max-width:${Math.round(Wd*1.3)}px;min-width:${Math.round(Wd*.82)}px" role="img" aria-label="Alléluia à quatre voix">${lines}${P.join("")}</svg>`,lists};
}

function gregSVG(){
  const Y=[22,32,42,52]; let s=`<svg class="staff" viewBox="0 0 330 96" style="max-width:440px;min-width:300px" role="img" aria-label="Schéma de notation grégorienne">`;

  s+=`<g class="hi"><rect x="10" y="14" width="3" height="16" fill="currentColor"/><rect x="13" y="14" width="7" height="6" fill="currentColor"/><rect x="13" y="24" width="7" height="6" fill="currentColor"/></g>`;
  const sq=(x,y)=>`<rect x="${x-4}" y="${y-3.5}" width="8" height="7" fill="currentColor"/>`;
  s+=sq(70,42)+sq(70,37)+`<line x1="74" x2="74" y1="37" y2="42" stroke="currentColor" stroke-width="1.4"/>`;
  s+=sq(130,32)+sq(170,37)+sq(182,42)+sq(230,37)+sq(244,42);
  s+=`<line x1="207" x2="207" y1="32" y2="42" stroke="currentColor" stroke-width="1.2"/>`;
  s+=`<g class="hi"><rect x="306" y="30" width="5" height="5" fill="currentColor"/><line x1="311" x2="311" y1="33" y2="22" stroke="currentColor" stroke-width="1.2"/></g>`;
  s+=`<text class="ly" x="72" y="72" text-anchor="middle">Ky-</text><text class="ly" x="130" y="72" text-anchor="middle">ri-</text><text class="ly" x="176" y="72" text-anchor="middle">e</text><text class="ly" x="237" y="72" text-anchor="middle">e-</text>`;
  s+=`<text class="lb hi" x="15" y="90" text-anchor="middle">clé de do</text><text class="lb" x="150" y="90" text-anchor="middle">neumes (notes carrées)</text><text class="lb hi" x="306" y="90" text-anchor="middle">guidon</text></svg>`;

/* ---------- Son ---------- */
let AC=null; const PLAY={nodes:[],timers:[]};
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();} if(AC.state==="suspended") AC.resume(); return AC;}catch(e){return null;}}
function tone(midi,t0,dur,vol){const c=ac(); if(!c) return; vol=vol||.22;

<p>Pour toute autre note, partez du repère le plus proche et comptez les crans en récitant les noms.</p>
<h3>Pas et sauts</h3>
<p>Quand la mélodie passe d’une ligne à l’interligne voisin, c’est la note voisine : le mouvement est <b>conjoint</b>. Quand elle va de ligne en ligne, elle saute une note : le mouvement est <b>disjoint</b>. Lire les écarts aide autant que lire les noms.</p>
${ex("l2-pas")}
<h3>Premier déchiffrage</h3>
<p>Nommez à voix haute chaque note de cet air, puis vérifiez avec « Afficher les noms ». Écoutez ensuite pour comparer avec ce que vous connaissez.</p>
${ex("l2-clair")}
<p>Passez maintenant de la lecture à la voix : chantez ce que vous venez de lire.</p>
<div class="w-sing" data-sx="gamme"></div>
<div class="w-sing" data-sx="clair"></div>
<p>Pour progresser vite, faites l’<a href="#entrainement">entraînement « Lire les notes »</a> quelques minutes chaque jour.</p>
${rub(["Nommez les dix premières notes de votre voix sur un chant de la chorale. Si vous êtes en clé de fa, faites l’exercice sur la portée des sopranos ; la leçon 6 vous apprendra la vôtre.","Si besoin, écrivez les noms au crayon sous les notes, et gommez-les la semaine suivante."])}`,
quiz:[nq("sol","G4",4,"Sur la 2e ligne, la ligne de la clé."),nq("sol","E4",2,"Première ligne : mi (« Michel »)."),nq("sol","C5",0,"3e interligne : do (FA-LA-DO-MI)."),nq("sol","F5",3,"5e ligne : fa (« Facilement »)."),nq("sol","C4",0,"Le do central, sur sa petite ligne sous la portée."),
 {q:"En montant, quelle note vient après si ?",o:["la","do","ré"],a:1,e:"Après si, on recommence au do, une octave plus haut."}]},

{id:3,titre:"La durée des notes",but:"Savoir combien de temps tenir chaque note.",html:`
<p class="lead">La position d’une note dit laquelle chanter ; sa forme dit combien de temps la tenir.</p>
<h3>Le temps</h3>
<p>La musique s’appuie sur une <b>pulsation</b> régulière, comme le tic-tac d’une horloge. Chaque battement est un <b>temps</b>. Les durées se comptent en temps.</p>
${ex("l3-valeurs")}
${tbl(["Figure","Comment la reconnaître","Durée"],[["Ronde","tête vide, sans hampe","4 temps"],["Blanche","tête vide avec une hampe","2 temps"],["Noire","tête pleine avec une hampe","1 temps"],["Croche","noire avec un crochet","½ temps"],["Double croche","noire avec deux crochets","¼ de temps"]])}
<p>La <b>hampe</b> (le bâton) monte ou descend selon la place de la note : cela ne change rien à la durée.</p>
<h3>Croches groupées</h3>
<p>Plusieurs croches qui se suivent sont souvent reliées par une barre au lieu d’avoir chacune un crochet. Deux croches reliées valent une noire ; quatre doubles croches reliées par deux barres aussi.</p>
${ex("l3-croches")}
<h3>Le point</h3>
<p>Un point à droite de la note ajoute la moitié de sa durée : blanche pointée = 2 + 1 = 3 temps ; noire pointée = 1 + ½ = 1 temps et demi.</p>
${ex("l3-point")}
<h3>La liaison</h3>
<p>Un arc qui relie deux notes <b>de même hauteur</b> les soude : on chante une seule note, tenue pendant la durée totale.</p>
${ex("l3-liaison")}
<p>Dans les chants, un arc entre des notes de hauteurs différentes indique en général qu’une même syllabe se chante sur plusieurs notes. On appelle cela un <b>mélisme</b> ; il y en a beaucoup dans les Gloria et les Alléluia.</p>
<h3>Dire le rythme</h3>
<p>On peut parler un rythme : « ta » pour une noire, « taa » pour une blanche, « ti-ti » pour deux croches. Tapez une pulsation régulière du pied, parlez le rythme, puis écoutez.</p>
${ex("l3-rythme")}
<div class="w-sing" data-sx="tenue"></div>
${rub(["Trouvez sur votre partition une blanche, une noire, deux croches reliées et une note pointée.","Parlez le rythme de la première ligne de votre voix en « ta / ti-ti », sans chanter les notes."])}`,
quiz:[
 {q:"Combien de temps dure une blanche ?",o:["1","2","4"],a:1,e:"La blanche vaut 2 temps, soit deux noires."},
 {q:"Combien de croches faut-il pour faire une noire ?",o:["1","2","4"],a:1,e:"Une croche dure un demi-temps."},
 {q:"Combien de temps dure cette note ?",ex:{items:[{n:"G4",d:"h",dot:1}],noplay:1},o:["2","3","4"],a:1,e:"Blanche pointée : 2 + 1 = 3 temps."},
 {q:"Combien de noires dans une ronde ?",o:["2","3","4"],a:2,e:"La ronde dure 4 temps."},
 {q:"Deux notes de même hauteur reliées par un arc…",o:["se chantent séparément","se chantent comme une seule note tenue"],a:1,e:"C’est une liaison de prolongation : on ne réattaque pas la seconde note."}]},

{id:4,titre:"Les silences",but:"Reconnaître les silences, les compter et y respirer.",html:`
<p class="lead">En chorale, les silences comptent autant que les notes : c’est là que l’on respire, et c’est là qu’une voix se tait pendant que les autres chantent.</p>
<h3>Les cinq silences</h3>
${ex("l4-silences")}
${tbl(["Silence","Durée","Équivaut à"],[["Pause","4 temps","une ronde"],["Demi-pause","2 temps","une blanche"],["Soupir","1 temps","une noire"],["Demi-soupir","½ temps","une croche"],["Quart de soupir","¼ de temps","une double croche"]])}
<h3>Pause ou demi-pause ?</h3>
<p>Elles se ressemblent : deux petits rectangles noirs. La <b>pause</b>, plus lourde, <b>pend sous la 4e ligne</b>. La <b>demi-pause</b>, plus légère, <b>est posée sur la 3e ligne</b> comme un chapeau.</p>
${ex("l4-pause")}
<p>Une pause seule dans une mesure signifie aussi « toute la mesure en silence », quelle que soit sa longueur.</p>
<h3>Compter les silences</h3>
<p>Pendant un silence, la pulsation continue : on compte dans sa tête. Écoutez et suivez.</p>
${ex("l4-rythme")}
<h3>Plusieurs mesures de silence</h3>
<p>Quand votre voix se tait longtemps, la partition montre un rectangle épais avec un nombre au-dessus : c’est le nombre de mesures à compter avant de reprendre. Comptez-les sur vos doigts : <i>1</i>-2-3-4, <i>2</i>-2-3-4, <i>3</i>-2-3-4…</p>
<h3>Respirer</h3>
<p>Une petite virgule au-dessus de la portée indique un endroit pour respirer. Sans virgule, respirez sur les silences ou à la fin d’une phrase du texte, jamais au milieu d’un mot.</p>
${rub(["Repérez tous les silences de votre voix sur un chant.","Marquez au crayon une petite virgule là où vous allez respirer, puis demandez au chef si ces respirations conviennent."])}`,
quiz:[
 {q:"Comment s’appelle ce silence ?",ex:{items:[{r:"q"}],noplay:1,minW:110},o:["Soupir","Demi-soupir","Pause"],a:0,e:"Le soupir dure 1 temps, comme une noire."},
 {q:"Le soupir dure autant que…",o:["une blanche","une noire","une croche"],a:1,e:"1 temps."},
 {q:"Ce rectangle pend sous la 4e ligne. C’est…",ex:{items:[{r:"w"}],noplay:1,minW:110},o:["une pause (4 temps)","une demi-pause (2 temps)"],a:0,e:"La pause pend ; la demi-pause est posée."},
 {q:"Pendant un silence, la pulsation…",o:["s’arrête","continue : on compte dans sa tête"],a:1,e:"Sinon, on repart trop tôt ou trop tard."},
 {q:"Où respirer quand rien n’est indiqué ?",o:["Au milieu d’un mot","Sur un silence ou en fin de phrase"],a:1,e:"On respire avec le sens du texte."}]},

{id:5,titre:"La mesure et la pulsation",but:"Compter les temps, repérer le temps fort et suivre le geste du chef.",html:`
<p class="lead">Les notes se rangent dans des cases de même durée : les mesures. C’est ce qui permet à toute la chorale de rester ensemble.</p>
<h3>Barres de mesure</h3>
<p>Des traits verticaux découpent la portée en <b>mesures</b>. Une double barre, dont la seconde est épaisse, marque la fin du chant.</p>
<h3>Le chiffrage</h3>
<p>Après la clé, deux chiffres empilés indiquent la mesure. Le chiffre du haut donne le <b>nombre de temps</b> par mesure. Celui du bas donne <b>la figure qui vaut un temps</b> : 4 pour la noire, 2 pour la blanche, 8 pour la croche.</p>
${tbl(["Chiffrage","Lecture"],[["4/4 (ou C)","4 temps, un temps = une noire"],["3/4","3 temps de noire"],["2/4","2 temps de noire"],["6/8","2 temps, chacun vaut une noire pointée (3 croches)"]])}
${ex("l5-44")}
${ex("l5-34")}
<h3>Le temps fort</h3>
<p>Le premier temps de chaque mesure est le <b>temps fort</b> : c’est là que tombe naturellement l’accent du texte. En 4/4, le 3e temps est légèrement appuyé ; les autres sont faibles.</p>
<h3>La levée</h3>
<p>Beaucoup de cantiques commencent <b>avant</b> le premier temps fort : la première mesure est incomplète. C’est une <b>levée</b> (ou anacrouse). Comptez la mesure entière dans votre tête et entrez au bon moment.</p>
${ex("l5-levee")}
<h3>Les gestes du chef</h3>
<p>Le chef « bat la mesure ». Le premier temps est toujours un geste vers le bas.</p>
${tbl(["Mesure","Geste"],[["2 temps","bas, haut"],["3 temps","bas, droite, haut"],["4 temps","bas, gauche, droite, haut"]])}
<h3>Le métronome</h3>
<p>Choisissez 4 temps et battez la mesure avec la main en suivant les clics. Le premier temps est plus aigu.</p>
<div class="w-metro"></div>
${rub(["Trouvez le chiffrage de trois chants de votre répertoire.","L’un d’eux commence-t-il par une levée ? Sur quel temps ?"])}`,
quiz:[
 {q:"En 3/4, combien de temps par mesure ?",o:["3","4","7"],a:0,e:"Le chiffre du haut donne le nombre de temps."},
 {q:"Dans le chiffrage 4/4, que signifie le 4 du bas ?",o:["Qu’un temps vaut une noire","Qu’il y a 4 mesures","Qu’on chante à 4 voix"],a:0,e:"4 = noire, 2 = blanche, 8 = croche."},
 {q:"Quel est le temps fort de la mesure ?",o:["Le premier","Le dernier"],a:0,e:"Le premier temps, juste après la barre de mesure."},
 {q:"Une levée, c’est…",o:["une ou plusieurs notes avant le premier temps fort","un silence au début du chant"],a:0,e:"La première mesure est alors incomplète."},
 {q:"Le premier temps battu par le chef va…",o:["vers le haut","vers le bas","vers la gauche"],a:1,e:"Toujours vers le bas, quelle que soit la mesure."}]},

{id:6,titre:"La clé de fa",but:"Lire les notes des voix graves.",html:`
<p class="lead">Les basses lisent en clé de fa, et les ténors aussi dans les recueils à deux portées. Les autres voix ont intérêt à la connaître pour suivre l’ensemble.</p>
<h3>Le repère : la 4e ligne</h3>
<p>Les deux points de la clé de fa encadrent la 4e ligne. Une note posée sur cette ligne s’appelle <b>fa</b>. Le reste se déduit en comptant les crans, exactement comme en clé de sol.</p>
${ex("l6-echelle")}
<h3>Lignes et interlignes</h3>
<div class="pair">${ex("l6-lignes")}${ex("l6-inter")}</div>
<p class="mnemo">Pour les lignes : « <b>Sol</b>ange <b>Si</b>ffle <b>Ré</b>gulièrement <b>Fa</b>ce au <b>La</b>c ».<br>Pour les interlignes : <b>LA-DO-MI-SOL</b>.</p>
<h3>Le pont entre les deux clés</h3>
<p>Le <b>do central</b> est le même son dans les deux clés : sur une petite ligne sous la portée en clé de sol, sur une petite ligne au-dessus de la portée en clé de fa. C’est là que les deux portées d’un recueil se rejoignent.</p>
${ex("l6-reperes")}
<p>Astuce : à position égale, la note en clé de fa porte le nom situé <b>deux crans plus haut</b> que celle de la clé de sol. La 1re ligne est mi en clé de sol, sol en clé de fa.</p>
<h3>Lecture</h3>
${ex("l6-lecture")}
<p>Entraînez-vous ensuite avec l’<a href="#entrainement">entraînement « Lire les notes »</a> en choisissant la clé de fa.</p>
${rub(["Basses, et ténors en clé de fa : nommez les notes de votre voix sur un chant.","Sopranos et altos : nommez les cinq premières notes de la basse de ce même chant."])}`,
quiz:[nq("fa","F3",3,"Sur la 4e ligne, la ligne de la clé."),nq("fa","G2",4,"1re ligne : sol (« Solange »)."),nq("fa","C4",0,"Le do central, sur sa petite ligne au-dessus de la portée."),nq("fa","A2",5,"1er interligne : la (LA-DO-MI-SOL)."),nq("fa","D3",1,"3e ligne : ré (« Régulièrement »)."),
 {q:"En clé de fa, la note sur la 1re ligne s’appelle…",o:["mi","sol","fa"],a:1,e:"Deux crans plus haut que le mi de la clé de sol."}]},

{id:7,titre:"Dièses, bémols et armure",but:"Comprendre les altérations et savoir lesquelles s’appliquent.",html:`
<p class="lead">Entre certaines notes voisines existe une note intermédiaire. Les altérations permettent de l’écrire.</p>
<h3>Tons et demi-tons</h3>
<p>Sur un clavier, deux touches voisines (blanche ou noire) sont séparées d’un <b>demi-ton</b>. Entre mi et fa, et entre si et do, il n’y a pas de touche noire : ces notes ne sont qu’à un demi-ton. Entre les autres notes voisines, il y a un <b>ton</b>. Essayez :</p>
<div class="w-kb"></div>
<h3>Les trois signes</h3>
${tbl(["Signe","Nom","Effet"],[["♯","dièse","monte la note d’un demi-ton"],["♭","bémol","descend la note d’un demi-ton"],["♮","bécarre","annule le dièse ou le bémol"]],0)}
${ex("l7-signes")}
<h3>Combien de temps dure une altération ?</h3>
<p>Une altération écrite devant une note vaut pour cette note et pour toutes les notes <b>à la même place</b> qui suivent, <b>jusqu’à la fin de la mesure</b>. Après la barre, elle s’efface.</p>
${ex("l7-mesure")}
<h3>L’armure</h3>
<p>Quand des dièses ou des bémols sont écrits juste après la clé, au début de chaque portée, ils forment l’<b>armure</b>. Ils s’appliquent à <b>toutes</b> les notes de ce nom, à toutes les hauteurs, pendant tout le chant.</p>
${ex("l7-armure")}
${ex("l7-armure-b")}
<p>Les dièses s’ajoutent toujours dans le même ordre : fa, do, sol, ré, la, mi, si. Les bémols dans l’ordre inverse : si, mi, la, ré, sol, do, fa. Pour chanter, inutile de connaître la tonalité : regardez sur quelles lignes ou quels interlignes sont posés les signes de l’armure et retenez quelles notes sont modifiées.</p>
<div class="w-sing" data-sx="fadiese"></div>
${rub(["Regardez l’armure de vos chants : combien de dièses ou de bémols, et sur quelles notes ?","Entourez au crayon les altérations écrites au milieu du chant : ce sont souvent les passages délicats."])}`,
quiz:[
 {q:"Le dièse…",o:["monte la note d’un demi-ton","descend la note d’un demi-ton","annule une altération"],a:0,e:"Le bémol descend, le bécarre annule."},
 {q:"Quel signe annule un dièse ou un bémol ?",o:["♭","♮","♯"],a:1,e:"Le bécarre."},
 {q:"Une altération écrite au milieu d’une mesure vaut…",o:["pour une seule note","jusqu’à la fin de la mesure","jusqu’à la fin du chant"],a:1,e:"Pour les notes à la même place, jusqu’à la barre de mesure."},
 {q:"Avec cette armure, comment se chante la note sur la 5e ligne ?",ex:{key:1,items:[{n:"F5",d:"w"}],noplay:1},o:["fa","fa♯","fa♭"],a:1,e:"Le dièse de l’armure est sur la ligne du fa : tous les fa sont dièse."},
 {q:"Entre mi et fa, il y a…",o:["un ton","un demi-ton"],a:1,e:"Pas de touche noire entre mi et fa."}]},

{id:8,titre:"Lire une partition à 4 voix",but:"Suivre sa ligne dans une partition de chorale sans se perdre.",html:`
<p class="lead">Une partition de chorale réunit plusieurs voix. Le défi n’est pas de tout lire, mais de suivre sa ligne sans se perdre.</p>
<h3>Le système</h3>
<p>Les portées qui se chantent en même temps sont reliées à gauche par un trait et une accolade : c’est un <b>système</b>. On lit un système de gauche à droite, puis on passe au système suivant, plus bas sur la page, en retrouvant sa propre portée.</p>
<h3>Deux présentations courantes</h3>
${tbl(["Présentation","Où est ma voix ?"],[["4 portées","Une portée par voix, de haut en bas : soprano, alto, ténor, basse. Le nom est écrit au début."],["2 portées (recueils, chants d’assemblée)","Sopranos et altos partagent la portée en clé de sol ; ténors et basses la portée en clé de fa. Sur chaque portée, la voix du dessus a les hampes vers le haut, celle du dessous les hampes vers le bas."]])}
<div class="w-satb"></div>
<div class="w-sing" data-sx="alleluia"></div>
<h3>Les paroles</h3>
<p>Le texte est écrit sous la portée ou entre les deux portées. Les syllabes sont séparées par des tirets ; un trait prolongé après une syllabe indique qu’elle se tient sur plusieurs notes. Quand il y a plusieurs couplets, leurs textes sont empilés et numérotés 1., 2., 3. : suivez toujours la même ligne de texte pendant un couplet.</p>
<h3>Indications à repérer</h3>
${tbl(["Indication","Signification"],[["R. ou Refrain","repris par tous, souvent après chaque couplet"],["C. ou Couplet, Strophe","parfois confié à un soliste ou à un pupitre"],["unis. (unisson)","toutes les voix chantent la même mélodie"],["div. (divisi)","le pupitre se sépare sur deux notes"],["Tutti / Solo","tout le monde / une seule personne"]])}
${rub(["Sur un chant à 4 voix, repérez où commence chaque système.","Trouvez votre voix au premier système et suivez-la du doigt jusqu’à la fin en écoutant un enregistrement. Notez les endroits où vous avez perdu le fil."])}`,
quiz:[
 {q:"Sur une portée en clé de sol partagée, les notes à hampe vers le bas sont celles des…",o:["sopranos","altos"],a:1,e:"La voix du dessous a les hampes vers le bas."},
 {q:"Sur la portée en clé de fa partagée, les notes à hampe vers le haut sont celles des…",o:["ténors","basses"],a:0,e:"Les ténors sont au-dessus des basses."},
 {q:"À la fin d’un système, on continue…",o:["sur la portée juste en dessous","au système suivant, sur sa propre portée"],a:1,e:"La portée juste en dessous est celle d’une autre voix."},
 {q:"« unis. » signifie…",o:["toutes les voix chantent la même mélodie","chanter doucement"],a:0,e:"Unisson."},
 {q:"Plusieurs lignes de texte numérotées sous les mêmes notes, ce sont…",o:["les couplets","les voix"],a:0,e:"On suit la ligne du couplet en cours."}]},

{id:9,titre:"Nuances, tempo et reprises",but:"Comprendre les indications d’expression et le chemin à suivre dans la partition.",html:`
<p class="lead">Autour des notes, la partition indique comment chanter et dans quel ordre lire.</p>
<h3>Les nuances</h3>
${tbl(["Signe","Nom","Effet"],[["pp","pianissimo","très doux"],["p","piano","doux"],["mp","mezzo piano","moyennement doux"],["mf","mezzo forte","moyennement fort"],["f","forte","fort"],["ff","fortissimo","très fort"],["&lt; ou cresc.","crescendo","de plus en plus fort"],["&gt; ou dim.","decrescendo, diminuendo","de plus en plus doux"]],0)}
<h3>Le tempo</h3>
<p>En haut à gauche, un mot ou un nombre indique la vitesse. « ♩ = 72 » signifie 72 noires par minute : réglez le métronome de la leçon 5 sur 72 pour l’entendre.</p>
${tbl(["Indication","Sens"],[["Lento, Adagio","lent"],["Andante","allant, au pas"],["Moderato","modéré"],["Allegro","rapide, joyeux"],["rit., rall.","en ralentissant"],["a tempo","on revient au tempo de départ"]])}
<p>Le <b>point d’orgue</b>, un arc avec un point au-dessus d’une note, demande de tenir cette note plus longtemps, jusqu’au geste du chef. On le trouve souvent à la fin des phrases des cantiques.</p>
<h3>Les reprises</h3>
${ex("l9-reprise")}
${tbl(["Indication","Que faire"],[["Barres de reprise (deux points contre une double barre)","chanter deux fois le passage encadré"],["Cases 1. et 2.","au premier passage, chanter la case 1 ; au second, sauter directement à la case 2"],["D.C. (da capo)","revenir au début"],["D.S. (dal segno)","revenir au signe (un S barré entouré de deux points)"],["Fine","fin du chant après la reprise"],["Coda","sauter à la conclusion, marquée d’un cercle traversé d’une croix"]])}
<p>À la messe, le chef ou l’animateur décide souvent du nombre de couplets : notez-le au crayon avant la célébration.</p>
${rub(["Sur un chant que vous préparez, surlignez les nuances.","Tracez au crayon le chemin complet : refrain, couplet 1, refrain, couplet 2…"])}`,
quiz:[
 {q:"mf signifie…",o:["moyennement fort","très fort","moyennement doux"],a:0,e:"mezzo forte."},
 {q:"Le signe « &lt; » sous des notes demande de…",o:["chanter de plus en plus fort","ralentir","accélérer"],a:0,e:"C’est un crescendo."},
 {q:"« ♩ = 60 » signifie…",o:["60 noires par minute","60 mesures"],a:0,e:"Une noire par seconde."},
 {q:"Un point d’orgue demande de…",o:["tenir la note jusqu’au geste du chef","respirer"],a:0,e:"La pulsation est suspendue sur cette note."},
 {q:"« a tempo » signifie…",o:["revenir au tempo de départ","chanter sur le temps fort"],a:0,e:"Souvent après un rit."}]},

{id:10,titre:"Déchiffrer seul un chant liturgique",but:"Préparer un chant seul, du premier regard à la répétition.",html:`
<p class="lead">Vous avez tous les outils. Voici une méthode pour préparer un chant seul, du premier regard à la répétition.</p>
<h3>La méthode en huit étapes</h3>
<ol>
<li><b>Repérer sa ligne</b> : votre portée, la clé, l’armure, le chiffrage, le tempo.</li>
<li><b>Survoler le parcours</b> : refrain, couplets, reprises, fin.</li>
<li><b>Lire le rythme seul</b> : parlez le texte en rythme en battant la mesure, sans chanter.</li>
<li><b>Nommer les notes en rythme</b> : dites do, ré, mi… en respectant les durées.</li>
<li><b>Trouver la première note</b> sur le clavier ci-dessous, ou demandez-la au chef.</li>
<li><b>Chanter lentement</b> sur « la » ou sur le nom des notes, phrase par phrase.</li>
<li><b>Ajouter le texte</b>, toujours lentement, puis accélérer jusqu’au tempo.</li>
<li><b>Marquer au crayon</b> les passages difficiles et les respirations.</li>
</ol>
<div class="w-kb"></div>
<h3>Les chants de la liturgie</h3>
<p><b>Refrain et couplets.</b> Beaucoup de chants de messe alternent un refrain repris par toute l’assemblée et des couplets chantés par la chorale ou un soliste. Apprenez toujours le refrain en premier.</p>
<p><b>La psalmodie.</b> Pour les psaumes, une grande partie du texte se chante sur une même note répétée, la note de récitation ; la mélodie ne bouge qu’à la fin de chaque phrase. Les recueils signalent les syllabes où l’on change de note (en gras, soulignées ou marquées d’un signe) : lisez la légende du livret.</p>
<p><b>La cote.</b> Les chants liturgiques en français portent souvent une cote, faite de lettres et de chiffres, attribuée par le SECLI (Secrétariat des éditeurs de chants pour la liturgie). Elle permet de retrouver un chant et ses différentes versions.</p>
<div class="w-sing" data-sx="psaume"></div>
<h3>Bonus : la notation grégorienne</h3>
<p>Le chant grégorien (Kyrie, Salve Regina, Ave Maria…) s’écrit souvent dans une notation plus ancienne : portée de <b>4 lignes</b>, notes carrées appelées <b>neumes</b>, clé de do ou de fa posée sur une ligne pour donner le repère, et pas de chiffrage : le rythme suit le texte. À la fin de chaque ligne, un petit signe, le <b>guidon</b>, annonce la première note de la ligne suivante. Le principe reste le même : un repère, puis on compte les crans.</p>
<figure class="fig"><div class="scroll">${gregSVG()}</div><p class="swipe">Faites glisser pour voir la suite →</p><figcaption>Schéma d’une ligne grégorienne (mélodie inventée pour l’exemple). Ici, la clé de do est sur la ligne du haut : cette ligne est do.</figcaption></figure>
<h3>Et maintenant ?</h3>
<p>Gardez dix minutes par jour : trois minutes d’entraînement aux notes, trois minutes de rythme, puis un chant de la chorale avec la méthode. En quelques semaines, la lecture devient naturelle.</p>
${rub(["Choisissez un chant que la chorale n’a pas encore travaillé et appliquez les huit étapes.","Arrivez à la répétition en connaissant votre première note et le rythme de votre ligne."])}`,

 {q:"Par quoi commencer face à un nouveau chant ?",o:["Chanter tout de suite avec le texte","Repérer sa ligne, la clé, l’armure et la mesure"],a:1,e:"Le repérage évite la plupart des erreurs."},
 {q:"Avant de chanter les notes, on travaille…",o:["le rythme, en parlant le texte","les nuances"],a:0,e:"Un rythme juste est la base."},
 {q:"Dans la psalmodie, une grande partie du texte se chante…",o:["sur une seule note","sur une mélodie différente à chaque mot"],a:0,e:"La note de récitation."},
 {q:"La portée grégorienne a…",o:["4 lignes","5 lignes","6 lignes"],a:0,e:"Quatre lignes et des notes carrées."},
 {q:"Le guidon, à la fin d’une ligne grégorienne,…",o:["annonce la première note de la ligne suivante","indique de respirer"],a:0,e:"Il aide à enchaîner les lignes."}]}

["Clé","Signe en début de portée qui donne le nom d’une ligne."],

["Interligne","Espace entre deux lignes de la portée."],

function hydrate(root){
  root.querySelectorAll(".ex").forEach(el=>{const d=EX[el.dataset.ex]; if(d) el.outerHTML=figHTML(d[0],d[1]);});
  root.querySelectorAll(".exq").forEach(el=>{const L=LESSONS[el.dataset.l-1], sp=L.quiz[el.dataset.qi].ex; const r=staffSVG(sp); el.innerHTML=`<div class="fig" style="max-width:260px;padding:6px 10px">${r.svg}</div>`;});
  root.querySelectorAll(".w-metro").forEach(metroWidget);
  root.querySelectorAll(".w-kb").forEach(kbWidget);
  root.querySelectorAll(".w-satb").forEach(satbWidget);
  root.querySelectorAll(".quiz").forEach(quizLogic);
  const tn=root.querySelector("#trN"); if(tn) trainerNotes(tn);
  const tr=root.querySelector("#trR"); if(tr) trainerRhythm(tr);
  if(root.querySelector("#expCode")) saveLogic(root);
  root.querySelectorAll(".w-sing").forEach(el=>{if(!el.closest("details")) singWidget(el,el.dataset.sx);});
  root.querySelectorAll(".w-free").forEach(freeWidget);
  root.querySelectorAll("details.sx").forEach(d=>d.addEventListener("toggle",()=>{const el=d.querySelector(".w-sing"); if(d.open&&el) singWidget(el,el.dataset.sx);}));
  markOverflow(root);
}

function kbWidget(el){
  // Une octave (+ le do du dessus) sur téléphone pour des touches assez larges, deux octaves sur grand écran
  const nO=el.getBoundingClientRect().width>=560?2:1, low=S.voice==="basse"||S.voice==="tenor";
  let oct=(low?3:4)-(nO===2?1:0);
  const WH=[0,2,4,5,7,9,11], BL=[[1,0],[3,1],[6,3],[8,4],[10,5]];
  function draw(){
    const whites=nO*7+1, wpc=100/whites;
    let html=`<div class="row" style="margin-bottom:10px"><button class="btn sm" data-o="-1">‹ Plus grave</button><button class="btn sm" data-o="1">Plus aigu ›</button></div><div class="kb-wrap"><div class="kb">`;
    for(let o=0;o<nO;o++) WH.forEach((s,i)=>{const m=12*(oct+1+o)+s; html+=`<button class="kw" data-key="${m}" aria-label="${FR[i]}">${FR[i]}${m===60?"<small>do central</small>":""}</button>`;});
    {const m=12*(oct+1+nO); html+=`<button class="kw" data-key="${m}" aria-label="do">do${m===60?"<small>do central</small>":""}</button>`;}
    for(let o=0;o<nO;o++) BL.forEach(([s,i])=>{const m=12*(oct+1+o)+s, left=(o*7+i+1)*wpc-wpc*.32; html+=`<button class="kbk" data-key="${m}" style="left:${left}%;width:${wpc*.64}%" aria-label="touche noire"></button>`;});
    html+=`</div></div>`; el.innerHTML=html;
  }
  draw();
  el.addEventListener("click",ev=>{const o=ev.target.closest("[data-o]"); if(o){oct=Math.max(1,Math.min(6-nO,oct+(+o.dataset.o))); draw(); return;}
    const k=ev.target.closest("[data-key]"); if(k){const c=ac(); if(!c) return; tone(+k.dataset.key,c.currentTime+.02,.9,.25); k.classList.add("on"); setTimeout(()=>k.classList.remove("on"),400);}});
}

function metroWidget(el){
  let bpm=72, beats=4, timer=null, next=0, beat=0;
  el.outerHTML=`<section class="widget metro" id="metro"><h3>Métronome</h3>
<div class="row"><span class="tempo"><span id="mBpm">72</span></span><span class="muted small">battements par minute</span></div>
<input type="range" id="mRange" min="40" max="160" value="72" aria-label="Tempo">
<div class="row" style="margin-top:8px"><div class="seg" role="group" aria-label="Temps par mesure"><button data-b="2">2 temps</button><button data-b="3">3 temps</button><button data-b="4" aria-pressed="true">4 temps</button></div>
<button class="btn sm play" id="mGo">${ICON_PLAY}Démarrer</button></div><div class="dots" id="mDots"></div></section>`;
  const box=document.getElementById("metro"), dots=box.querySelector("#mDots"), go=box.querySelector("#mGo");
  function drawDots(){dots.innerHTML=Array.from({length:beats},(_,i)=>`<i class="${i===0?"first":""}"></i>`).join("");}
  drawDots();
  function sched(){const c=ac(); while(next<c.currentTime+.12){const b=beat; click(next,b===0); const delay=(next-c.currentTime)*1000;
      PLAY.timers.push(setTimeout(()=>{dots.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on",i===b));},Math.max(0,delay)));
      next+=60/bpm; beat=(beat+1)%beats;}}
  function stop(){clearInterval(timer); timer=null; go.innerHTML=ICON_PLAY+"Démarrer"; dots.querySelectorAll("i").forEach(d=>d.classList.remove("on"));}
  go.addEventListener("click",()=>{if(timer){stop();return;} const c=ac(); if(!c) return; next=c.currentTime+.08; beat=0; timer=setInterval(sched,25); go.innerHTML=ICON_STOP+"Arrêter";});
  box.querySelector("#mRange").addEventListener("input",ev=>{bpm=+ev.target.value; box.querySelector("#mBpm").textContent=bpm;});
  box.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>{beats=+b.dataset.b; beat=0; box.querySelectorAll("[data-b]").forEach(x=>x.setAttribute("aria-pressed",x===b)); drawDots();}));
  window.addEventListener("hashchange",stop,{once:true});
}

function quizLogic(sec){
  const L=LESSONS[sec.dataset.quiz-1]; const ans={};
  sec.addEventListener("click",ev=>{
    const b=ev.target.closest(".opt"); if(b){const li=b.closest(".q"), qi=+li.dataset.q; if(qi in ans) return;
      const qq=L.quiz[qi], oi=+b.dataset.oi, ok=oi===qq.a; ans[qi]=ok;
      li.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true; if(i===qq.a) x.classList.add("good"); else if(i===oi) x.classList.add("bad");});
      const fb=li.querySelector(".fb"); fb.hidden=false; fb.className="fb "+(ok?"good":"bad"); fb.innerHTML=`<b>${ok?"Juste.":"Pas tout à fait."}</b> ${qq.e||""}`;
      if(qq.ex&&qq.ex.items[0].n){const r=staffSVG(qq.ex); const ev0=r.ev.find(e=>e.m!=null); const c=ac(); if(c&&ev0) tone(ev0.m,c.currentTime+.02,.8,.2);}
      if(Object.keys(ans).length===L.quiz.length){const sc=Object.values(ans).filter(Boolean).length, tot=L.quiz.length, prev=S.quiz[L.id];
        S.quiz[L.id]={best:Math.max(sc,prev?prev.best:0),total:tot}; save();
        const r=sec.querySelector(".qres"); r.hidden=false;
        r.innerHTML=`<p><strong>${sc} / ${tot}</strong></p><p>${sc===tot?"Parfait. Vous pouvez marquer la leçon comme terminée.":sc>=tot-1?"Très bien. Relisez le point manqué, puis passez à la suite.":"Relisez la leçon et refaites le quiz demain : la répétition fait le travail."}</p><button class="btn sm" data-retry>Recommencer le quiz</button>`;}
      return;}
    if(ev.target.closest("[data-retry]")){const fresh=document.createElement("div"); fresh.innerHTML=quizHTML(L); const n=fresh.firstElementChild; sec.replaceWith(n); hydrate(n); quizLogic(n); n.scrollIntoView({block:"start"});}
  });
}

function trainerNotes(box){
  let clef=S.voice==="basse"?"fa":"sol", cur=null, streak=0, waiting=false;
  const card=box.querySelector(".card"), msg=box.querySelector(".msg"), stats=box.querySelector(".stats");
  function seg(){box.querySelectorAll("[data-clef]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.clef===clef));}
  function showStats(){const t=S.train[clef]; stats.innerHTML=`<span>Série en cours : <b>${streak}</b></span><span>Meilleure série : <b>${t.best}</b></span><span>Réussite : <b>${t.n?Math.round(t.ok*100/t.n):0} %</b> sur ${t.n}</span>`;}
  function next(){const r=clef==="fa"?[16,28]:[28,40]; let d; do{d=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));}while(cur&&d===cur.d);

/* Détection de hauteur (algorithme YIN) */
function yin(buf,sr){
  const N=buf.length, half=N>>1; let rms=0; for(let i=0;i<N;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/N); if(rms<.01) return null;

  for(let t=1;t<=tMax+1;t++){let s=0; for(let i=0;i<half;i++){const x=buf[i]-buf[i+t]; s+=x*x;} d[t]=s;}
  d[0]=1; let run=0; for(let t=1;t<=tMax+1;t++){run+=d[t]; d[t]=run?d[t]*t/run:1;}
  let tau=-1; for(let t=tMin;t<=tMax;t++){if(d[t]<.15){while(t+1<=tMax&&d[t+1]<d[t]) t++; tau=t; break;}}
  if(tau<2) return null;
  const x0=d[tau-1], x1=d[tau], x2=d[tau+1], den=x0+x2-2*x1, sh=den?(x0-x2)/(2*den):0;
  return sr/(tau+sh);
}

function freeWidget(el){
  el.outerHTML=`<section class="sing" id="free"><p class="eyebrow">Ma voix en direct</p><h3>Quelle note je chante ?</h3>
<p class="small muted">Chantez une note tenue sur « la » : la page affiche son nom et sa place sur votre portée. Glissez doucement de votre note la plus grave à la plus aiguë pour mesurer votre tessiture.</p>
<div class="mnote"></div><div class="sfig"></div>
<div class="snow"><div class="target"><span class="tl">Vous chantez</span><span class="tname">–</span></div>${GAUGE}<div class="glab"><span>un peu bas</span><span>au centre de la note</span><span>un peu haut</span></div><p class="msg" aria-live="polite"></p></div>
<div class="row sctl"><button class="btn primary" data-f="go">${MIC_ICON}<span>Activer le micro</span></button><button class="btn sm" data-f="reset">Effacer ma tessiture</button></div>
<div class="tess"></div></section>`;
  const box=document.getElementById("free"), $=s=>box.querySelector(s), fig=$(".sfig"), tname=$(".tname"), needle=$(".needle"), msg=$(".msg"), go=$('[data-f="go"]'), tess=$(".tess");
  let alive=false, last=null, since=0, shown=null; const api={halt};
  function draw(m){const c=voiceClef(); let items=[];
    if(m!=null&&m>30&&m<90){const written=c==="sol8"?m+12:m; items=[{n:midiP(written),d:"w",hi:1}];}
    fig.innerHTML=`<div class="fig echo-card">${staffSVG({clef:c,items,noplay:1,minW:150}).svg}</div>`;}
  function drawTess(){const r=S.chant.range;
    if(r.lo==null){tess.innerHTML=`<p class="small muted">Tessiture : pas encore mesurée.</p>`; return;}
    const c=voiceClef(), wr=m=>c==="sol8"?m+12:m;
    tess.innerHTML=`<p class="small"><b>Ma tessiture mesurée</b> : de ${midiName(r.lo)} à ${midiName(r.hi)} (${r.hi-r.lo} demi-tons). Elle sert à choisir les notes de « Répéter une note ».</p><div class="fig echo-card">${staffSVG({clef:c,items:[{n:midiP(wr(r.lo)),d:"w",t:"grave"},{n:midiP(wr(r.hi)),d:"w",t:"aigu"}],noplay:1,minW:160}).svg}</div>`;}
  function onPitch(m){if(m==null){needle.classList.add("off"); since=0; last=null; return;}
    const r=Math.round(m), c=(m-r)*100; tname.textContent=midiName(m); needle.classList.remove("off"); needle.classList.toggle("ok",Math.abs(c)<=25); needle.style.left=(50+c)+"%";
    if(r!==shown){draw(r); shown=r;}
    if(r===last){since+=45; if(since>=600&&r>=33&&r<=88){const R=S.chant.range; let ch=false; if(R.lo==null||r<R.lo){R.lo=r;ch=true;} if(R.hi==null||r>R.hi){R.hi=r;ch=true;} if(ch){save(); drawTess();}}} else {last=r; since=0;}}
  async function start(){if(ACTIVE&&ACTIVE!==api) ACTIVE.halt(); ACTIVE=api; stopAll(); if(!ac()) return;
    go.disabled=true; const mode=await ensureMic(); go.disabled=false;
    if(mode!=="mic"){$(".mnote").innerHTML=micHelpHTML().replace("Écoutez la note, chantez-la, puis réécoutez-la pour comparer et dites si c’était juste.","Cette partie a besoin du micro pour fonctionner."); if(ACTIVE===api) ACTIVE=null; return;}
    $(".mnote").innerHTML=""; alive=true; MIC.subs.add(onPitch); go.querySelector("span").textContent="Arrêter"; go.classList.remove("primary"); msg.textContent="Chantez…";}
  function halt(){alive=false; MIC.subs.delete(onPitch); go.querySelector("span").textContent="Activer le micro"; go.classList.add("primary"); needle.classList.add("off"); msg.textContent=""; if(ACTIVE===api) ACTIVE=null; micIdleLater();}
  box.addEventListener("click",ev=>{
    if(ev.target.closest("[data-retrymic]")){MIC.failed=null; start(); return;}
    const b=ev.target.closest("[data-f]"); if(!b) return;
    if(b.dataset.f==="go"){alive?halt():start();}
    if(b.dataset.f==="reset"){S.chant.range={lo:null,hi:null}; save(); drawTess();}
  });
  draw(null); drawTess();
}

function viewChant(){
  const voiceBtns=Object.keys(VOICES).map(v=>`<button class="btn sm" data-voice="${v}" aria-pressed="${S.voice===v}">${VNAME[VOICES[v]]}</button>`).join("");
  const list=Object.keys(SX).map(id=>{const D=SX[id], r=S.chant.ex[id];
    return `<details class="sx"><summary><span class="ln-num">${D.lecon}</span><span><span class="lt">${D.titre}</span><br><span class="small muted">Leçon ${D.lecon}</span></span><span class="st ${r?"done":"todo"}">${r?`${r.best}/${r.total}`:"À faire"}</span></summary><div class="w-sing" data-sx="${id}"></div></details>`;}).join("");
  return `<p class="eyebrow">De la lecture à la voix</p><h1>Chanter</h1>
<p class="lead">Chantez les notes que vous apprenez à lire. La page écoute votre voix au micro et vous indique si vous chantez juste, trop haut ou trop bas.</p>
<section class="panel"><h2>Votre voix</h2><p class="small muted">Les exercices s’écrivent dans votre clé et à votre hauteur.</p><div class="chips">${voiceBtns}</div></section>
<section class="panel"><h2>Avant de commencer</h2><ul class="tips">
<li>Installez-vous au calme, téléphone posé à 30 cm de la bouche.</li>
<li>Chantez sur « la » ou sur le nom des notes, d’une voix posée, sans forcer.</li>
<li>Tenez la note : la barre verte se remplit quand vous êtes juste.</li>
<li>La page n’écoute pas pendant qu’elle joue une note : chantez après le son.</li>
<li>« Accepter une autre octave » laisse chanter la bonne note plus haut ou plus bas que celle écrite, par exemple pour une voix d’homme sur une ligne de soprano.</li>
<li>Sur iPhone, désactivez le mode silencieux pour entendre les notes.</li></ul></section>
<div class="w-free"></div>
<h2>Exercices</h2><p class="small muted">Chaque exercice reprend une leçon. Touchez-en un pour l’ouvrir.</p>
${list}`;
}

/* ---------- Événements globaux ---------- */
document.addEventListener("click",ev=>{
  const p=ev.target.closest("[data-play]"); if(p){playFig(p.dataset.play); return;}
  const so=ev.target.closest("[data-solo]"); if(so){playFig(so.dataset.solo,so.dataset.v); return;}
  const mi=ev.target.closest("[data-mine]"); if(mi){playMine(mi.dataset.mine,mi.dataset.v); return;}
  if(ev.target.closest("[data-stop]")){stopAll(); return;}
  const nm=ev.target.closest("[data-names]"); if(nm){const f=document.getElementById(nm.dataset.names); const on=f.classList.toggle("show-names"); nm.setAttribute("aria-pressed",on); nm.textContent=on?"Masquer les noms":"Afficher les noms"; return;}
  const v=ev.target.closest("[data-voice]"); if(v){S.voice=S.voice===v.dataset.voice?"":v.dataset.voice; save(); document.querySelectorAll("[data-voice]").forEach(b=>b.setAttribute("aria-pressed",S.voice===b.dataset.voice));
    if(location.hash==="#chant"){const y=window.scrollY; route(); window.scrollTo(0,y);} return;}
  const d=ev.target.closest("[data-done]"); if(d){const id=+d.dataset.done; S.done[id]=!S.done[id]; if(S.done[id]&&S.last===id) S.last=id<10?id+1:id; save();
    d.className="btn "+(S.done[id]?"isdone":"primary"); d.textContent=S.done[id]?"Leçon terminée ✓ (annuler)":"Marquer la leçon comme terminée"; return;}
  const n=ev.target.closest(".staff [data-m]"); if(n){const c=ac(); if(!c) return; tone(+n.dataset.m,c.currentTime+.02,.8,.24); n.classList.add("on"); setTimeout(()=>n.classList.remove("on"),500);}
});
let noteTimer=null;
document.addEventListener("input",ev=>{const t=ev.target.closest("[data-note]"); if(!t) return; S.notes[t.dataset.note]=t.value; clearTimeout(noteTimer); noteTimer=setTimeout(save,400);});

function route(){
  stopAll(); singStopAll(); let hsh=(location.hash||"").replace("#","")||"accueil"; let html, nav=hsh;
  const m=/^lecon-(\d+)$/.exec(hsh);
  if(m&&+m[1]>=1&&+m[1]<=10){html=viewLesson(+m[1]); nav="accueil";}
  else if(hsh==="entrainement") html=viewTrain();
  else if(hsh==="lexique") html=viewLex();
  else if(hsh==="chant") html=viewChant();
  else if(hsh==="sauvegarde") html=viewSave();
  else {html=viewHome(); nav="accueil";}
  $view.innerHTML=html; hydrate($view);
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");});
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
updateStatus(); updateProgress(); route();
})();
</script>
